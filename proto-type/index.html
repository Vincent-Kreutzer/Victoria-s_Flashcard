<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>Victoria's flashcard App</title>  
    <meta name="viewport" width="device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../common.css">
  </head>

  <body>
    <h1>Victoria's flashcard App</h1>
    <h2>Deck List</h2>    
    <p>First, choose an existing deck from the deck list or create a new one.</p>
    <table id="deck-table" border="1">  
      <thead>
        <tr>
          <th>Deck Name</th>
          <th>Words</th>
        </tr>
      </thead>
      
      <tbody id="table-body"></tbody>
    </table>
    
    <button id="newdeck-btn">+ New Deck</button>
    <input type="text" id="input-deckname" class="hidden" placeholder="Deck name">
    <button id="add-btn" class="hidden">Add</button>
    <button id="cancel-btn" class="hidden">Cancel</button>


    <script src="../index.js"></script>
  </body>
  
</html>
